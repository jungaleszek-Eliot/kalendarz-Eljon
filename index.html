<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalendarz 3D + Widoki + Zegar</title>
    <style>
        :root { 
            --bg-color: #e0e5ec; --grid-bg: #e0e5ec; --text-main: #2d3748; --text-muted: #718096; 
            --border-color: rgba(163, 177, 198, 0.4); --line-color: rgba(163, 177, 198, 0.4); 
            --shadow-outer: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.7); 
            --shadow-inner: inset 6px 6px 10px rgba(163, 177, 198, 0.5), inset -6px -6px 10px rgba(255, 255, 255, 0.7); 
            --btn-hover: #d1d8e0; --modal-bg: rgba(224, 229, 236, 0.95); --accent: #3b82f6; --highlight: #ef4444; 
            --night-bg: rgba(0, 0, 0, 0.05); --day-bg: transparent;
        }
        [data-theme*="dark"] { --night-bg: rgba(0, 0, 0, 0.25); --day-bg: rgba(255, 255, 255, 0.02); }
        [data-theme="dark"] { --bg-color: #1a1e24; --grid-bg: #1a1e24; --text-main: #e2e8f0; --text-muted: #a0aec0; --border-color: rgba(255, 255, 255, 0.2); --line-color: rgba(255, 255, 255, 0.05); --shadow-outer: 8px 8px 16px rgba(0, 0, 0, 0.6), -8px -8px 16px rgba(45, 52, 60, 0.5); --shadow-inner: inset 6px 6px 10px rgba(0, 0, 0, 0.6), inset -6px -6px 10px rgba(45, 52, 60, 0.3); --btn-hover: #15181d; --modal-bg: rgba(26, 30, 36, 0.95); --accent: #60a5fa; --highlight: #ef4444; }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 15px 20px; background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.4s, color 0.4s; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; }
        
        .top-controls { display: flex; flex-direction: column; max-width: 1400px; width: 100%; margin: 0 auto 15px auto; gap: 15px; flex-shrink: 0; }
        .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; width: 100%; }
        .controls-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; } 
        .header-container { display: flex; justify-content: space-between; align-items: center; flex-grow: 1; flex-wrap: wrap; gap: 10px; margin: 0 10px; }
        
        .header-title { display: flex; flex-direction: column; align-items: center; justify-content: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); flex-grow: 1; text-align: center; }
        #week-title { font-size: 1.8rem; font-weight: 700; text-align: center; }
        
        .clock-wrapper { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        
        .nav-btn, .theme-select { background-color: var(--bg-color); border: none; border-radius: 12px; padding: 10px 16px; font-size: 0.95rem; font-weight: 600; color: var(--text-main); cursor: pointer; box-shadow: var(--shadow-outer); transition: all 0.2s ease; outline: none; font-family: inherit; white-space: nowrap; }
        .theme-select { appearance: none; padding-right: 35px; background-image: url('data:image/svg+xml;utf8,<svg fill="currentColor" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>'); background-repeat: no-repeat; background-position-x: 95%; background-position-y: 50%; }
        .nav-btn:hover, .theme-select:hover { background-color: var(--btn-hover); }
        .nav-btn:active { box-shadow: var(--shadow-inner); transform: scale(0.98); }

        .color-picker-btn { width: 42px; height: 42px; padding: 0; border: none; border-radius: 12px; cursor: pointer; background: transparent; overflow: hidden; box-shadow: var(--shadow-outer); flex-shrink: 0; }
        .color-picker-btn::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-btn::-webkit-color-swatch { border: none; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); }

        .view-container { display: none; background: var(--grid-bg); border-radius: 20px; box-shadow: var(--shadow-outer); max-width: 1400px; width: 100%; flex-grow: 1; margin: 0 auto; padding: 10px; transition: all 0.4s; overflow: hidden; box-sizing: border-box; }
        
        /* NOWY PODZIAŁ WIDOKU DNI/TYGODNIA - MIEJSCE NA MODUŁY Z LEWEJ */
        #view-day-week { display: flex; gap: 15px; position: relative; height: calc(100vh - 120px); background: transparent; box-shadow: none; padding: 0; }
        
        .dashboard-panel { width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 15px; }
        .large-clock-widget { background: var(--grid-bg); border-radius: 16px; box-shadow: var(--shadow-inner); padding: 25px 10px; text-align: center; font-size: 4.8rem; font-weight: 900; color: var(--highlight); letter-spacing: 2px; }
        
        .calendar-main-area { display: flex; flex-grow: 1; position: relative; border-radius: 20px; box-shadow: var(--shadow-outer); overflow: hidden; background: var(--grid-bg); padding: 10px; }
        
        .time-labels { width: 70px; flex-shrink: 0; border-right: 2px solid var(--border-color); display: flex; flex-direction: column; }
        .time-label { flex-grow: 1; text-align: right; padding-right: 12px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); box-sizing: border-box; display: flex; align-items: flex-start; justify-content: flex-end; transform: translateY(-7px); }
        
        .days-wrapper { display: flex; flex-grow: 1; position: relative; border-radius: 12px; box-shadow: var(--shadow-inner); height: 100%; overflow: hidden; }
        .day-column { flex: 1; position: relative; border-right: 1px solid var(--border-color); height: 100%; transition: background-color 0.3s; }
        .day-column:last-child { border-right: none; }
        .day-column:hover { background-color: rgba(163, 177, 198, 0.05); }
        .day-column.drag-over { background-color: rgba(239, 68, 68, 0.15) !important; box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.3); }
        
        .day-grid-bg { position: absolute; top: 40px; bottom: 0; left: 0; right: 0; z-index: 1; pointer-events: none; background-image: linear-gradient(to bottom, var(--line-color) 1px, transparent 1px), linear-gradient(to bottom, var(--night-bg) 0%, var(--night-bg) 25%, var(--day-bg) 25%, var(--day-bg) 91.666%, var(--night-bg) 91.666%, var(--night-bg) 100%); background-size: 100% calc(100% / 24), 100% 100%; }

        .current-day-highlight { background-color: rgba(239, 68, 68, 0.05) !important; }
        .day-header.current-day-text { border-bottom: 2px solid var(--highlight); color: var(--highlight); }
        .day-header { text-align: center; padding: 8px 0; font-weight: 700; background: var(--grid-bg); border-bottom: 2px solid var(--border-color); position: sticky; top: 0; z-index: 20; height: 40px; line-height: 1.1; pointer-events: none; box-sizing: border-box; }
        .day-date-sub { display: block; font-size: 0.75rem; font-weight: 500; color: inherit; opacity: 0.8; }
        
        #current-time-line { position: absolute; height: 2px; background-color: var(--highlight); box-shadow: 0 0 8px var(--highlight); z-index: 15; display: none; pointer-events: none; transition: left 0.3s ease; }
        #current-time-line::before { content: ''; position: absolute; left: -6px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background-color: var(--highlight); box-shadow: 0 0 10px var(--highlight), inset 2px 2px 4px rgba(255,255,255,0.5); }

        #view-month { flex-direction: column; padding: 15px; }
        .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: var(--border-color); border: 2px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-inner); height: 100%; }
        .month-header-cell { background: var(--grid-bg); padding: 8px; text-align: center; font-weight: bold; color: var(--text-main); }
        .month-cell { background: var(--grid-bg); padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; overflow: hidden; box-sizing: border-box; }
        .month-cell:hover { background: rgba(163, 177, 198, 0.1); }
        .month-cell.empty { background: rgba(0,0,0,0.03); cursor: default; }
        [data-theme*="dark"] .month-cell.empty { background: rgba(255,255,255,0.02); }
        .month-cell-day { text-align: right; font-size: 0.9rem; font-weight: bold; color: var(--text-muted); margin-bottom: 2px; pointer-events: none; }
        .month-event-pill { font-size: 0.7rem; padding: 2px 4px; border-radius: 4px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 1px 1px 3px rgba(0,0,0,0.2); pointer-events: none; font-weight: 600; }

        #view-year { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 15px; overflow-y: auto; }
        .year-month-block { background: var(--grid-bg); border-radius: 12px; padding: 10px; box-shadow: var(--shadow-inner); }
        .year-month-title { text-align: center; font-weight: bold; margin-bottom: 8px; color: var(--text-main); }
        .year-days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 0.75rem; }
        .year-day-h { font-weight: bold; color: var(--text-muted); margin-bottom: 3px; }
        .year-day-cell { padding: 3px 0; border-radius: 4px; color: var(--text-main); cursor: pointer; transition: background 0.2s; box-sizing: border-box; }
        .year-day-cell:hover { background: rgba(163, 177, 198, 0.2); }
        .year-day-cell.has-event { background: var(--accent); color: white; font-weight: bold; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }

        .event-block { position: absolute; left: 10px; right: 10px; z-index: 5; }
        .event-block.local-event { cursor: grab; }
        .event-block.local-event:active { cursor: grabbing; opacity: 0.8; }
        .event-box { position: relative; width: 100%; height: 100%; }
        .event-block:hover { z-index: 25; }
        
        .event-content { position: absolute; top: 15px; left: 4px; right: 4px; bottom: 0; border-radius: 16px; border-left: 2px solid rgba(255,255,255,0.3); border-right: 2px solid rgba(255,255,255,0.3); border-bottom: 8px solid; z-index: 10; padding: 22px 6px 6px 6px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 4px; color: white; font-size: 0.75rem; font-weight: 700; }
        .event-content::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.15); border-radius: inherit; pointer-events: none; }
        .event-lid { position: absolute; top: 0; left: -6px; right: -6px; height: 35px; border-radius: 16px 16px 8px 8px; border-top: 2px solid rgba(255,255,255,0.5); border-left: 2px solid rgba(255,255,255,0.3); border-right: 2px solid rgba(255,255,255,0.3); border-bottom: 5px solid; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); z-index: 20; transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.8rem; font-weight: 800; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); overflow: hidden; padding: 0 6px; pointer-events: none; }
        .event-lid::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,0.25), transparent); border-radius: inherit; pointer-events: none; }
        .event-block:hover .event-lid { transform: translateY(-12px); }
        .event-content span, .event-content .event-actions { position: relative; z-index: 2; text-shadow: 1px 1px 2px rgba(0,0,0,0.4); }
        
        .event-actions { display: flex; gap: 4px; margin-top: auto; padding-bottom: 2px; }
        .event-actions button { background: rgba(255,255,255,0.3); border: none; color: inherit; border-radius: 6px; cursor: pointer; padding: 4px 6px; font-weight: 800; font-size: 0.85rem; transition: background 0.2s, transform 0.1s; backdrop-filter: blur(2px); }
        .event-actions button:hover { background: rgba(255,255,255,0.7); transform: scale(1.1); color: #1e293b; text-shadow: none; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; overflow-y: auto; padding: 20px; }
        .modal-box { background: var(--modal-bg); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: var(--shadow-outer); display: flex; flex-direction: column; gap: 15px; color: var(--text-main); margin: auto; }
        .modal-box h3 { margin: 0 0 5px 0; text-align: center; }
        .modal-box input[type="text"], .modal-box select { background: var(--bg-color); border: none; padding: 12px; border-radius: 10px; color: var(--text-main); font-family: inherit; font-size: 1rem; box-shadow: var(--shadow-inner); outline: none; width: 100%; box-sizing: border-box;}
        
        .modal-legend-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: -10px; text-align: center; }
        .legend-container { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 10px; border-radius: 12px; background: rgba(0,0,0,0.03); box-shadow: var(--shadow-inner); }
        [data-theme*="dark"] .legend-container { background: rgba(255,255,255,0.02); }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .legend-color { width: 14px; height: 14px; border-radius: 3px; border-top: 1px solid rgba(255,255,255,0.4); box-shadow: 2px 2px 4px rgba(0,0,0,0.1); }

        .time-row { display: flex; gap: 10px; align-items: center; margin-bottom: 5px; }
        .time-row select { flex: 1; font-weight: 700; font-size: 1.1rem; text-align: center; appearance: none; background-image: url('data:image/svg+xml;utf8,<svg fill="currentColor" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>'); background-repeat: no-repeat; background-position-x: 90%; background-position-y: 50%; }
        .time-row span { font-weight: 900; font-size: 1.2rem; color: var(--text-muted); }

        .modal-btns { display: flex; gap: 10px; margin-top: 5px; }
        .modal-btns button { flex: 1; text-align: center; }
        .btn-save { background: var(--accent) !important; color: white !important; }
    </style>
</head>
<body>

    <div class="top-controls">
        <div class="nav-row">
            <div class="controls-group">
                <select id="app-theme" class="theme-select">
                    <option value="light">⚪ Klasyczny Jasny</option>
                    <option value="dark">⚫ Klasyczny Ciemny</option>
                </select>

                <input type="color" id="bg-color-picker" class="color-picker-btn" title="Wybierz własny kolor z palety">
                
                <select id="view-select" class="theme-select">
                    <option value="day">Dzień</option>
                    <option value="weekA" selected>Tydzień A (Dzisiaj + 6 dni)</option>
                    <option value="weekB">Tydzień B (Wczoraj + 6 dni)</option>
                    <option value="weekC">Tydzień C (Pon-Nie)</option>
                    <option value="month">Miesiąc</option>
                    <option value="year">Rok</option>
                </select>
            </div>

            <div class="header-container">
                <button id="btn-prev" class="nav-btn">&#10094; Wstecz</button>
                <div class="header-title">
                    <span id="week-title">Ładowanie...</span>
                </div>
                <div class="clock-wrapper">
                    <button id="btn-next" class="nav-btn">Dalej &#10095;</button>
                </div>
            </div>
        </div>
    </div>

    <!-- WIDOK DZIEŃ / TYDZIEŃ Z NOWYM LEWYM PANELEM NA MODUŁY -->
    <div id="view-day-week">
        <div class="dashboard-panel">
            <div class="large-clock-widget" id="large-live-clock">--:--</div>
            <!-- W to miejsce dodamy docelowo więcej elementów -->
        </div>
        
        <div class="calendar-main-area">
            <div class="time-labels" id="time-labels"></div>
            <div class="days-wrapper" id="days-wrapper">
                <div id="current-time-line"></div>
            </div>
        </div>
    </div>

    <!-- WIDOK MIESIĄC -->
    <div id="view-month" class="view-container">
        <div class="month-grid" id="month-grid"></div>
    </div>

    <!-- WIDOK ROK -->
    <div id="view-year" class="view-container"></div>

    <!-- OKNO DO DODAWANIA / EDYCJI WYDARZEŃ -->
    <div class="modal-overlay" id="event-modal">
        <div class="modal-box">
            <h3 id="modal-title">Zarządzaj wpisem</h3>
            <input type="text" id="ev-title" placeholder="Nazwa wydarzenia..." autocomplete="off">
            
            <div class="modal-legend-title">Dostępne kategorie</div>
            <div class="legend-container" id="legend-container"></div>
            
            <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: -10px; margin-top: 10px;">Wybierz Kategorię:</label>
            <select id="ev-category"></select>

            <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: -10px;">Godzina rozpoczęcia:</label>
            <div class="time-row">
                <select id="ev-start-h"></select><span>:</span><select id="ev-start-m"></select>
            </div>
            
            <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: -10px;">Godzina zakończenia:</label>
            <div class="time-row">
                <select id="ev-end-h"></select><span>:</span><select id="ev-end-m"></select>
            </div>

            <input type="hidden" id="ev-date"> 
            <div class="modal-btns">
                <button class="nav-btn" onclick="zamknijModal()">Anuluj</button>
                <button class="nav-btn btn-save" onclick="zapiszWydarzenieLokalne()">Zapisz</button>
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = {
            'praca': { name: 'Praca', gradient: 'linear-gradient(135deg, #3b82f6, #1d4ed8)', borderLid: '#2563eb', borderBox: '#1e40af' },
            'zmiana-dzienna': { name: 'Zmiana Dzienna', gradient: 'linear-gradient(135deg, #d8b4e2, #b886cd)', borderLid: '#a66bbd', borderBox: '#8a4ca3', textColor: '#fff44f' },
            'zmiana-nocna': { name: 'Zmiana Nocna', gradient: 'linear-gradient(135deg, #59357a, #3b1b5e)', borderLid: '#2d124c', borderBox: '#1e0a36', textColor: '#fff44f' },
            'dom': { name: 'Dom / Rodzina', gradient: 'linear-gradient(135deg, #10b981, #047857)', borderLid: '#059669', borderBox: '#064e3b' },
            'zdrowie': { name: 'Zdrowie', gradient: 'linear-gradient(135deg, #14b8a6, #0f766e)', borderLid: '#0d9488', borderBox: '#115e59' },
            'rozrywka': { name: 'Rozrywka / Sport', gradient: 'linear-gradient(135deg, #a855f7, #7e22ce)', borderLid: '#9333ea', borderBox: '#6b21a8' },
            'wazne': { name: 'Ważne / Pilne', gradient: 'linear-gradient(135deg, #ef4444, #b91c1c)', borderLid: '#dc2626', borderBox: '#991b1b' },
            'inne': { name: 'Inne', gradient: 'linear-gradient(135deg, #94a3b8, #475569)', borderLid: '#64748b', borderBox: '#334155' }
        };

        const hoursOptions = Array.from({length: 24}, (_, i) => `<option value="${String(i).padStart(2,'0')}">${String(i).padStart(2,'0')}</option>`).join('');
        const minsOptions = Array.from({length: 60}, (_, i) => `<option value="${String(i).padStart(2,'0')}">${String(i).padStart(2,'0')}</option>`).join('');
        
        document.getElementById('ev-start-h').innerHTML = hoursOptions; document.getElementById('ev-end-h').innerHTML = hoursOptions;
        document.getElementById('ev-start-m').innerHTML = minsOptions; document.getElementById('ev-end-m').innerHTML = minsOptions;

        function inicjalizujKategorie() {
            const legendContainer = document.getElementById('legend-container');
            const selectCategory = document.getElementById('ev-category');
            
            Object.keys(CATEGORIES).forEach(key => {
                const cat = CATEGORIES[key];
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<div class="legend-color" style="background: ${cat.gradient}; border-bottom-color: ${cat.borderLid};"></div><span>${cat.name}</span>`;
                legendContainer.appendChild(item);

                const option = document.createElement('option');
                option.value = key; option.innerText = cat.name;
                selectCategory.appendChild(option);
            });
        }
        inicjalizujKategorie();

        function zgadnijKategorie(title) {
            const t = (title || "").toLowerCase();
            if (t.includes('dzienna')) return 'zmiana-dzienna';
            if (t.includes('nocna')) return 'zmiana-nocna';
            if (t.includes('lekarz') || t.includes('dentysta') || t.includes('badanie') || t.includes('wizyta')) return 'zdrowie';
            if (t.includes('spotkanie') || t.includes('praca') || t.includes('dyżur') || t.includes('szkolenie')) return 'praca';
            if (t.includes('kino') || t.includes('impreza') || t.includes('basen') || t.includes('trening') || t.includes('mecz') || t.includes('wyjazd')) return 'rozrywka';
            if (t.includes('urodziny') || t.includes('szkoła') || t.includes('wywiadówka') || t.includes('zakupy')) return 'dom';
            if (t.includes('ważne') || t.includes('zapłacić') || t.includes('rat') || t.includes('rachunek') || t.includes('!')) return 'wazne';
            return 'inne';
        }

        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('large-live-clock');
            if(clockEl) {
                clockEl.innerText = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            }
        }
        setInterval(updateClock, 1000); updateClock();

        function applySmartContrast(hex) {
            const root = document.documentElement;
            root.style.setProperty('--grid-bg', hex);
            root.style.setProperty('--bg-color', hex);
            
            let r = parseInt(hex.substring(1, 3), 16);
            let g = parseInt(hex.substring(3, 5), 16);
            let b = parseInt(hex.substring(5, 7), 16);
            let brightness = (r * 299 + g * 587 + b * 114) / 1000;

            if (brightness > 128) {

            if (editingEventId) { const index = wydarzeniaLokalne.findIndex(ev => ev.id === editingEventId); if (index !== -1) { wydarzeniaLokalne[index].title = title; wydarzeniaLokalne[index].category = category; wydarzeniaLokalne[index].start = startDate.toISOString(); wydarzeniaLokalne[index].end = endDate.toISOString(); } } 
            else { wydarzeniaLokalne.push({ id: Date.now().toString(), title: title, category: category, start: startDate.toISOString(), end: endDate.toISOString() }); }
            localStorage.setItem('mojeWydarzenia', JSON.stringify(wydarzeniaLokalne)); zamknijModal(); odswiezWidok();

        function formatujZakresTygodnia(dataZrodlowa, type) {
            const dataPocz = new Date(dataZrodlowa); 
            if (type === 'B') {
                dataPocz.setDate(dataPocz.getDate() - 1);
            } else if (type === 'C') {
                const dzienTyg = dataPocz.getDay(); 
                dataPocz.setDate(dataPocz.getDate() - dzienTyg + (dzienTyg === 0 ? -6 : 1));
            }
            const dataKoncowa = new Date(dataPocz); dataKoncowa.setDate(dataPocz.getDate() + 6);
            
            const pDzien = String(dataPocz.getDate()).padStart(2, '0'); const pMiesiac = String(dataPocz.getMonth() + 1).padStart(2, '0');
            const kDzien = String(dataKoncowa.getDate()).padStart(2, '0'); const kMiesiac = String(dataKoncowa.getMonth() + 1).padStart(2, '0');
            return pMiesiac === kMiesiac ? `(${pDzien} - ${kDzien}.${kMiesiac}.${dataKoncowa.getFullYear()})` : `(${pDzien}.${pMiesiac} - ${kDzien}.${kMiesiac}.${dataKoncowa.getFullYear()})`;
        }
        
        function getWeekNumber(d) { const date = new Date(d.getTime()); date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7)); return Math.ceil((((date - new Date(Date.UTC(date.getUTCFullYear(), 0, 1))) / 86400000) + 1) / 7); }

        function parseICal(icalText) {
            const events = []; const lines = icalText.split(/\r?\n/); let currentEvent = null;
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                while (i + 1 < lines.length && (lines[i+1].startsWith(' ') || lines[i+1].startsWith('\t'))) { i++; line += lines[i].substring(1); }
                if (line === 'BEGIN:VEVENT') { currentEvent = {}; } 
                else if (line === 'END:VEVENT') { 
                    if (currentEvent && currentEvent.start) events.push(currentEvent);
                    currentEvent = null; 
                } 
                else if (currentEvent) {
                    if (line.startsWith('SUMMARY:')) { currentEvent.title = line.substring(8); currentEvent.category = zgadnijKategorie(currentEvent.title); } 
                    else if (line.startsWith('DTSTART')) { currentEvent.start = parseICalDate(line); } 
                    else if (line.startsWith('DTEND')) { currentEvent.end = parseICalDate(line); }
                }
            } return events;
        }

        function parseICalDate(line) {
            const parts = line.split(':'); if (parts.length < 2) return null;
            let dStr = parts[1];
            const y = dStr.substring(0, 4), m = dStr.substring(4, 6), d = dStr.substring(6, 8);
            if (dStr.length === 8) return new Date(y, m - 1, d);
            const hr = dStr.substring(9, 11), min = dStr.substring(11, 13), sec = dStr.substring(13, 15);
            return dStr.endsWith('Z') ? new Date(Date.UTC(y, m - 1, d, hr, min, sec)) : new Date(y, m - 1, d, hr, min, sec);
        }
